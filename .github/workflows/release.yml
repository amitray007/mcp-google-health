name: Release

# Release Please keeps a release PR open on main. Merging it tags vX.Y.Z, creates the GitHub
# release, and publishes both packages. Every release bumps the patch version; put
# `Release-As: X.Y.Z` in a commit body to choose a minor or major version.
# To retry a failed publish: gh workflow run release.yml -f tag=vX.Y.Z
# Each registry skips a version it already has.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.0.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_VERSION: 2026.11.5

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # One place that decides whether this run publishes, and which tag.
  target:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}

  # A skipped release-please job on a manual run would skip everything after it without these
  # explicit conditions.
  check:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.tag }}

  build:
    needs: [target, check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: ${{ env.MISE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Check that every version matches the tag
        run: node scripts/check-versions.ts "$TAG"
        env:
          TAG: ${{ needs.target.outputs.tag }}
      - run: mise run build
      - run: pnpm --dir packages/typescript pack --pack-destination ../../dist/npm
      - run: mkdir -p dist/python && cp packages/python/dist/* dist/python/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  npm:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish unless this version is already on npm
        run: |
          tarball=$(ls dist/npm/*.tgz)
          spec=$(tar -xOzf "$tarball" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0)); p.name + '@' + p.version")
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published."
          else
            npm publish "$tarball" --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/python/
          skip-existing: true
